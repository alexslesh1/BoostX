name: Windows build

# Builds Nexora.exe on a real Windows machine, after checking the routing
# engine there (driver, capture, tunnel, live rule changes). The exe is
# attached to the run and to the "nexora-test-build" pre-release.
on:
  push:
    branches: ["claude/**", "main"]
  workflow_dispatch:
    inputs:
      api_url:
        description: "Backend address baked into the exe"
        required: false

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # The backend the test build talks to. Override per run (input above) or
  # for the repository (Settings → Variables → NEXORA_API_URL). A file
  # api_url.txt next to Nexora.exe overrides it on a given PC.
  NEXORA_BUILD_API_URL: ${{ github.event.inputs.api_url || vars.NEXORA_API_URL || 'http://82.139.231.54:8000/api/v1' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: nexora-core/go.mod
          cache-dependency-path: nexora-core/go.sum

      - name: Build the engine from source
        shell: bash
        run: |
          ./nexora-core/build.sh
          cd nexora-core
          mkdir -p ../selftest
          CGO_ENABLED=0 go build -trimpath -o ../selftest/nexora-testrelay.exe ./cmd/nexora-testrelay
          cp ../src/boostx/resources/engine/nexora-engine.exe ../src/boostx/resources/engine/WinDivert64.* ../selftest/

      - name: Go tests
        working-directory: nexora-core
        run: go test ./... -count=1

      - name: Engine self-test on real Windows
        run: ./packaging/windows-selftest.ps1 -Dir "$PWD/selftest"

      # Informational: whether the test server answers from the internet.
      # The build goes on either way.
      - name: Check the test server from outside
        continue-on-error: true
        run: |
          $api = $env:NEXORA_BUILD_API_URL
          $relayHost = ([uri]$api).Host
          Write-Host "backend health ($api/health):"
          & curl.exe -sS -m 10 -w "  -> HTTP %{http_code} in %{time_total} s`n" "$api/health"
          Write-Host "relay $relayHost`:4700 (UDP probe):"
          & ./selftest/nexora-engine.exe probe "$relayHost`:4700"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the app
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest "pyinstaller>=6.10"

      - name: App tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

      - name: Bake in the backend address
        run: |
          $url = $env:NEXORA_BUILD_API_URL
          Set-Content -Path src/boostx/config/build_config.py -Encoding utf8 -Value @"
          """Generated by the Windows build workflow."""
          DEFAULT_API_URL: str | None = "$url"
          "@
          Write-Host "Backend: $url"

      - name: Build Nexora.exe
        run: python -m PyInstaller packaging/nexora.spec --noconfirm --clean

      - name: Start Nexora.exe and check it stays up
        run: |
          $log = Join-Path $env:APPDATA "Nexora\logs"
          $p = Start-Process dist/Nexora.exe -PassThru
          Start-Sleep -Seconds 25
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process -Id $p.Id -Force }
          Get-ChildItem $log -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_.FullName }
          if (-not $alive) { throw "Nexora.exe exited on its own (code $($p.ExitCode))" }
          $text = (Get-ChildItem $log -Filter *.log | Get-Content -Raw)
          if ($text -notmatch "Starting Nexora") { throw "Nexora.exe did not log its start" }
          if ($text -match "Traceback") { throw "Nexora.exe logged an error" }
          Write-Host "Nexora.exe started and stayed up"
          (Get-Item dist/Nexora.exe).Length / 1MB | ForEach-Object { Write-Host ("size: {0:N1} MB" -f $_) }

      - uses: actions/upload-artifact@v4
        with:
          name: Nexora-windows
          path: dist/Nexora.exe

      - name: Publish as the test pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nexora-test-build --yes --cleanup-tag 2>$null
          $notes = @"
          Test build from ``$($env:GITHUB_REF_NAME)`` ($($env:GITHUB_SHA.Substring(0,7))).

          Backend: $env:NEXORA_BUILD_API_URL
          To use another server, put its address in a file ``api_url.txt`` next to Nexora.exe.
          "@
          gh release create nexora-test-build dist/Nexora.exe --prerelease --target $env:GITHUB_SHA --title "Nexora test build" --notes $notes
