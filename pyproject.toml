[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boostx"
version = "0.1.0"
description = "BoostX - system monitor, boost, cleaner and game launcher desktop app"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "psutil>=5.9",
    "loguru>=0.7",
    "httpx>=0.27",
    "python-socks>=2.8",
    "pydivert>=3.0.0,<4.0.0",
]

[project.scripts]
boostx = "boostx.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/boostx"]

[tool.hatch.build.targets.wheel.force-include]
"src/boostx/resources" = "boostx/resources"
