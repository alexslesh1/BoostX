[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boostx"
version = "0.1.0"
description = "Nexora - system monitor, boost, cleaner and game launcher desktop app"
requires-python = ">=3.11"
dependencies = [
    # 6.12.0 drops a reference to True/False on every signal that carries a
    # bool, which crashes Python 3.11 after a few hundred of them. Python
    # 3.12+ is unaffected (its bools cannot be freed).
    "PySide6>=6.7,!=6.12.0; python_version < '3.12'",
    "PySide6>=6.7; python_version >= '3.12'",
    "psutil>=5.9",
    "loguru>=0.7",
    "httpx>=0.27",
    "python-socks>=2.8",
]

[project.scripts]
nexora = "boostx.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/boostx"]

[tool.hatch.build.targets.wheel.force-include]
"src/boostx/resources" = "boostx/resources"
